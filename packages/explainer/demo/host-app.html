<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requirement Scorer (host app demo)</title>
<style>
:root{--bg:#F4F5F7;--panel:#fff;--ink:#1F2328;--soft:#5E656F;--line:#D5D9DE;--accent:#0A5BC4;--good:#1E8E1E;--mid:#B26B00;--bad:#C62828;--pe-accent:#0A5BC4;--pe-border:#D5D9DE;--pe-radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#14171A;--panel:#1D2125;--ink:#E9EBEE;--soft:#A3AAB4;--line:#343A41;--accent:#5B9BF0;--pe-accent:#5B9BF0;--pe-border:#343A41;--good:#4CC24C;--mid:#E0A000;--bad:#FF6B6B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:baseline}
header b{font-size:17px}header span{color:var(--soft);font-size:13px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 53px)}
nav{border-right:1px solid var(--line);background:var(--panel)}
nav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;padding:14px 18px;cursor:pointer;font:inherit}
nav button[aria-current=true]{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 3px 0 var(--accent)}
nav small{color:var(--soft);display:block}
.score{float:right;font-weight:700;font-variant-numeric:tabular-nums}
main{padding:24px;min-width:0}
h1{font-size:22px;margin:0 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.dim b{display:block;font-size:22px}.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
ul.f{margin:8px 0 0;padding-left:18px}ul.f li{margin:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 14px system-ui;padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;color:inherit;border:1px solid var(--line)}
code{font-size:12.5px}
.meta{font-size:13px;color:var(--soft);margin-top:8px}
@media (max-width:800px){.layout{grid-template-columns:1fr}nav{border-right:0}}
</style>
</head>
<body>
<header><b>Requirement Scorer</b><span>Host app demo: assesses business requirements, then explains the process each one touches</span></header>
<div class="layout">
  <nav id="list" aria-label="Requirements"></nav>
  <main>
    <h1 id="t"></h1><p id="tx" style="color:var(--soft);margin:0"></p>
    <div class="card"><div class="dims" id="dims"></div>
      <h3 style="margin:16px 0 0;font-size:15px">Assessment findings</h3><ul class="f" id="findings"></ul></div>
    <div class="card">
      <div class="row"><b>Process explainer</b><span style="flex:1"></span>
        <button class="btn ghost" id="theme" type="button">Toggle theme</button>
        <button class="btn" id="go" type="button">Explain how this requirement flows through the process</button></div>
      <p class="meta" id="meta">The score and findings above are sent to the generator as context; each finding appears as an open question on the step it affects.</p>
      <process-explainer id="pe" hide-header style="margin-top:12px"></process-explainer>
    </div>
  </main>
</div>
<!-- Embed: one script tag and one element. Everything above is the host app's own UI. -->
<script type="module" src="/embed.js"></script>
<script type="module">
const reqs = await (await fetch('/demo/requirements.json')).json();
const $ = (s) => document.querySelector(s), pe = $('#pe');
const colour = (n) => (n >= 75 ? 'var(--good)' : n >= 50 ? 'var(--mid)' : 'var(--bad)');
let cur = reqs[0];
$('#list').innerHTML = reqs.map((r, i) => `<button data-i="${i}"><span class="score" style="color:${colour(r.score)}">${r.score}</span><b>${r.id}</b><small>${r.title.replace(/</g, '&lt;')}</small></button>`).join('');
function pick(i) {
  cur = reqs[i];
  document.querySelectorAll('#list button').forEach((b, j) => b.setAttribute('aria-current', j === i));
  $('#t').textContent = `${cur.id}: ${cur.title}`; $('#tx').textContent = cur.text;
  $('#dims').innerHTML = Object.entries(cur.dimensions).map(([k, v]) => `<div class="dim"><span>${k}</span><b style="color:${colour(v)}">${v}</b><div class="bar"><i style="width:${v}%;background:${colour(v)}"></i></div></div>`).join('');
  $('#findings').innerHTML = cur.findings.map((f) => `<li>${f.replace(/</g, '&lt;')}</li>`).join('');
}
document.querySelectorAll('#list button').forEach((b) => (b.onclick = () => pick(+b.dataset.i)));
pick(0);

// The integration: pass the requirement as context, then generate.
$('#go').onclick = () => {
  pe.context = { requirement: { id: cur.id, title: cur.title, text: cur.text, score: cur.score, dimensions: cur.dimensions, findings: cur.findings } };
  $('#meta').textContent = 'Generating…';
  pe.generate({ prompt: `Explain the business process that requirement ${cur.id} changes: ${cur.text} Show where each assessment finding affects a step.`, processId: cur.processId });
};
pe.addEventListener('explainer-ready', (e) => { const m = e.detail.meta; $('#meta').textContent = `${m.ai ? 'AI (' + m.model + ')' : 'Offline replay, no AI'} · ${e.detail.spec.steps.length} steps · ${(m.durationMs / 1000).toFixed(1)}s${m.cached ? ' · cached' : ''}${m.warnings.length ? ' · ' + m.warnings.length + ' repaired' : ''}`; });
pe.addEventListener('explainer-error', (e) => { $('#meta').textContent = e.detail.message; });
let dark = matchMedia('(prefers-color-scheme: dark)').matches;
$('#theme').onclick = () => { dark = !dark; document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; pe.setAttribute('theme', dark ? 'dark' : 'light'); };
</script>
</body>
</html>

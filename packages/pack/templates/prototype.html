<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --go:#22A722;--dark-btn:#3F3F3F;--app-bg:#F1F1F1;--line:#D8D8D8;--ink:#2A2A2A;--ink-soft:#8A8A8A;
  --shell:#15171B;--shell-2:#1D2026;--shell-3:#262A32;--shell-line:#33373F;--shell-ink:#E8EAED;--shell-dim:#8D95A3;
  --brand:__BRAND__;--brand-ink:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--shell);color:var(--shell-ink);font-family:"IBM Plex Sans Condensed",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #6FA8FF;outline-offset:2px}
.topbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--shell-line);background:var(--shell-2);position:sticky;top:0;z-index:40}
.wordmark{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.wordmark b{font-size:19px;font-weight:700;letter-spacing:.02em}
.wordmark span{font-size:12px;color:var(--shell-dim);letter-spacing:.14em;text-transform:uppercase}
.entitlement{display:flex;align-items:center;gap:11px;background:var(--shell-3);border:1px solid var(--shell-line);border-radius:999px;padding:7px 14px 7px 15px}
.entitlement label{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--shell-dim)}
.entitlement select{background:transparent;color:var(--shell-ink);border:0;font:inherit;font-size:13px;font-weight:600}
.entitlement select option{color:#111}
.restart{background:none;border:1px solid var(--shell-line);color:var(--shell-dim);border-radius:999px;padding:8px 16px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.restart:hover{color:var(--shell-ink);border-color:#4A505C}
.stage{display:grid;grid-template-columns:242px minmax(0,1fr) 380px;min-height:calc(100vh - 57px);align-items:stretch}
.rail{border-right:1px solid var(--shell-line);background:var(--shell-2);padding:22px 0 40px}
.rail h2,.notes h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--shell-dim);margin:0 0 14px;padding:0 22px;font-weight:600}
.step{display:grid;grid-template-columns:30px 1fr;align-items:baseline;gap:8px;width:100%;background:none;border:0;text-align:left;color:var(--shell-dim);padding:7px 22px;font-size:13.5px;line-height:1.35;border-left:2px solid transparent}
.step em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.65}
.step:hover{color:var(--shell-ink);background:#22262E}
.step.done{color:#AEB6C4}
.step.on{color:#fff;background:#22262E;border-left-color:var(--brand);font-weight:600}
.step.on em{opacity:1;color:#7FB6F5}
.badge{font-style:normal;display:inline-block;vertical-align:middle;margin-left:7px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:2px 5px;border-radius:2px;font-weight:600;line-height:1.25;background:#7A5B15;color:#FBF3E2}
.railgroup{margin-top:16px;padding:12px 22px 4px;border-top:1px solid var(--shell-line);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#5C636F}
.deviceCol{display:flex;flex-direction:column;align-items:center;padding:34px 24px 48px;gap:16px;background:radial-gradient(900px 460px at 50% 0%,#232730 0%,var(--shell) 62%)}
.phone{width:392px;max-width:100%;height:794px;background:#fff;border-radius:38px;border:11px solid #0A0B0D;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px #34383F;overflow:hidden;display:flex;flex-direction:column;position:relative;font-family:Roboto,Arial,sans-serif;color:var(--ink)}
.hint{color:var(--shell-dim);font-size:12.5px;letter-spacing:.05em;text-align:center;max-width:392px}
.statusbar{height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:#fff;background:var(--brand)}
.appbar{flex:0 0 auto;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:15px}
.appbar .title{margin-left:auto}
.burger{display:flex;flex-direction:column;gap:4px;width:22px}
.burger i{display:block;height:3px;background:#fff;border-radius:2px}
.viewport{flex:1 1 auto;overflow-y:auto;background:var(--app-bg);padding:14px 12px 22px}
.card{background:#fff;border-radius:3px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.13);overflow:hidden}
.card>header{background:var(--brand);color:#fff;padding:12px 15px;font-size:15px}
.card .body{padding:17px 15px}
.field{margin-bottom:20px;position:relative}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
.field input,.field select{width:100%;border:0;border-bottom:1px solid #C4C4C4;background:transparent;font-family:Roboto,Arial;font-size:15.5px;color:var(--ink);padding:5px 0 7px;border-radius:0}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);background-position:calc(100% - 9px) 12px,calc(100% - 4px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.field input:focus,.field select:focus{outline:0;border-bottom:2px solid var(--brand);padding-bottom:6px}
.field.locked input{color:#8A8A8A;background:#EDEDED;border-bottom-color:#DADADA;padding-left:6px;pointer-events:none}
.field.locked label{color:#ACACAC}
.field .why{font-size:11px;color:#9A9A9A;margin-top:3px}
.req{color:var(--brand)}
.btn{border:0;border-radius:3px;padding:12px 16px;font-family:Roboto,Arial;font-size:15px;color:#fff;background:var(--brand);width:100%;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.go{background:var(--go)}.btn.dark{background:var(--dark-btn)}
.btn.ghost{background:#EDEDED;color:#3A3A3A;border:1px solid #D6D6D6}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tg{width:50px;height:26px;border-radius:999px;background:#CFCFCF;border:0;position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.tg[aria-pressed="true"]{background:#9ED89E}.tg[aria-pressed="true"]::after{transform:translateX(24px);background:var(--go)}
.pick{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid #DADADA;border-radius:7px;padding:12px;margin-bottom:9px;text-align:left;font-family:Roboto,Arial;font-size:14.5px;color:#3A3A3A}
.pick .box{width:21px;height:21px;border:2px solid #2A2A2A;border-radius:2px;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.pick.on{border-color:var(--brand)}.pick.on .box{background:var(--brand);border-color:var(--brand)}
.pick b{flex:1;font-weight:500}.pick small{display:block;color:#8A8A8A;font-weight:400}
.pick[disabled]{opacity:.45;cursor:not-allowed}
.quotedbar{display:flex;align-items:center;gap:12px;background:#2A2D33;color:#fff;border-radius:4px;padding:11px 13px;margin-bottom:16px}
.quotedbar .lab{font-size:10.5px;color:#A9B0BC;letter-spacing:.03em}
.quotedbar .amt{font-size:21px;font-weight:500}
.res{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #EEE;font-size:13px;line-height:1.35}
.res i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:12px;background:#C4C4C4}
.res.ok i{background:var(--go)}.res.bad i{background:#C62828}
.res b{display:block;font-size:11px;color:#8A8A8A;font-family:"IBM Plex Mono",monospace;font-weight:500}
.res .m{color:#C62828;font-size:12.5px}
.gate{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px solid #EEE}
.gate i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:12px;background:#C62828}
.gate.ok i{background:var(--go)}
.status{text-align:center;background:#EDEDED;border-radius:3px;padding:20px 12px;margin-bottom:16px}
.status small{display:block;color:#8A8A8A;font-size:12px}
.status b{font-size:26px;color:var(--brand)}
.toast{position:absolute;left:14px;right:14px;bottom:18px;background:#2A2D33;color:#fff;border-radius:4px;padding:12px 15px;font-size:13.5px;line-height:1.4;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.notes{border-left:1px solid var(--shell-line);background:var(--shell-2);padding:22px 0 44px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.notes section{padding:0 22px}
.notes section h2{padding:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;color:#7FB6F5;text-transform:uppercase;margin-bottom:7px}
.notes h3{margin:0 0 10px;font-size:17.5px;font-weight:600;line-height:1.28;color:#fff}
.spec{font-size:14px;line-height:1.62;color:#B4BCC9;margin:0 0 14px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:9px;font-size:13.5px;line-height:1.5;color:#9AA3B2}
.rules .tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;height:fit-content;white-space:nowrap;margin-top:1px;background:var(--shell-3);border:1px solid var(--shell-line);color:#7F8798}
.rules .tag.rule{color:#8FD48F;border-color:#2F5A2F;background:#1B2A1B}
.rules .tag.gate{color:#F0C36B;border-color:#5C4A22;background:#2A2415}
.rules .tag.data{color:#7FB6F5;border-color:#2A4665;background:#161F2B}
.rules .tag.q{color:#D79BE8;border-color:#553060;background:#241429}
.rules li.flagnote{background:#2A2415;border:1px solid #5C4A22;border-radius:4px;padding:9px 11px;color:#EADBB8}
.inspector{border-top:1px solid var(--shell-line);padding-top:20px}
.kv{font-family:"IBM Plex Mono",monospace;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.kv div{display:grid;grid-template-columns:150px 1fr;gap:9px;padding:3px 6px;border-radius:2px}
.kv .k{color:#6E7686;word-break:break-word}.kv .v{color:#CBD3E0;word-break:break-word}.kv .v.empty{color:#565D6B;font-style:italic}
.kv div.fresh{background:#132A18;box-shadow:inset 2px 0 0 #46A15C}.kv div.fresh .v{color:#9FE0B2}
.trace{font-size:12.5px;color:#9AA3B2;line-height:1.6}
.trace b{color:#C8D2E0;font-weight:600}
.trace code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#C8D2E0}
.foot{grid-column:1/-1;border-top:1px solid var(--shell-line);background:var(--shell-2);padding:18px 26px;font-size:12.5px;color:#6E7686;line-height:1.6}
.foot b{color:#98A1B0;font-weight:600}
@media (max-width:1180px){.stage{grid-template-columns:210px minmax(0,1fr)}.notes{grid-column:1/-1;border-left:0;border-top:1px solid var(--shell-line)}}
@media (max-width:820px){.stage{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--shell-line)}.deviceCol{padding:22px 12px 32px}.phone{height:720px;border-width:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wordmark"><b id="wm"></b><span id="wmsub">behavioural prototype</span></div>
  <div class="entitlement" id="roleBox" hidden><label for="role">Acting as</label><select id="role"></select></div>
  <button class="restart" id="restart">Restart journey</button>
</header>
<main class="stage">
  <nav class="rail" aria-label="Journey steps"><h2>Journey</h2><div id="railList"></div></nav>
  <div class="deviceCol"><div class="phone" id="phone"></div><p class="hint" id="hint"></p></div>
  <aside class="notes" aria-live="polite">
    <section><div class="eyebrow" id="noteStep"></div><h3 id="noteTitle"></h3><p class="spec" id="noteSpec"></p><ul class="rules" id="noteRules"></ul></section>
    <section class="inspector"><h2>Behind the screen</h2><div class="trace" id="trace"></div></section>
    <section class="inspector"><h2>Application state</h2><div class="kv" id="inspector"></div></section>
  </aside>
  <div class="foot" id="foot"></div>
</main>
<script>
"use strict";
const SPEC = __SPEC__;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = t => String(t || "").toLowerCase().replace(/[^a-z0-9]/g, "");
document.title = SPEC.title + " prototype";
$("#wm").textContent = SPEC.title;
$("#wmsub").textContent = `${SPEC.source} · behavioural prototype`;
$("#foot").innerHTML = `<b>About this prototype.</b> Every screen, field, option list and rule is generated from ${esc(SPEC.source)} at commit ${esc(SPEC.commit || "unknown")}: tables and fields from the schema, choices from seed data and code constants, rule messages from the rule classes, and role checks from the services. It runs entirely in the browser, with no backend. Sample values are made up.`;
const STEPS = SPEC.steps;
const ALL = STEPS.flatMap(s => s.screen.fields || []);
let st, cur, version, validation, roleSel, toastT;
function reset() {
  st = {}; ALL.forEach(d => { st[d.k] = d.type === "system" && d.options ? d.options[0] : ""; });
  STEPS.forEach(s => { if (s.screen.list) st[s.screen.list.k] = []; });
  cur = 0; version = 0; validation = null; fresh = new Set();
}
let fresh = new Set();
function roleOK(roles) { return !roles.length || roles.includes(roleSel); }
if (SPEC.roles && SPEC.roles.length) { $("#roleBox").hidden = false; $("#role").innerHTML = SPEC.roles.map(r => `<option>${esc(r)}</option>`).join(""); roleSel = SPEC.roles[0]; $("#role").onchange = e => { roleSel = e.target.value; render(); }; }
const optL = (d, v) => { if (!d.options) return v; const o = d.options.find(o => (o.v || o) === v); return o ? (o.l || o) : v; };
function set(k, v) { if (st[k] !== v) { st[k] = v; version++; fresh = new Set([k]); } }
function totalOf(k) { const s = STEPS.find(x => x.screen.list && x.screen.list.k === k); if (!s) return 0; return s.screen.list.options.filter(o => st[k].includes(o.v)).reduce((a, o) => a + (o.amt || 0), 0); }
function visitSystem(step) {
  for (const d of step.screen.fields || []) {
    if (d.type === "system" && !d.options && !st[d.k]) st[d.k] = /Generated/.test(d.note || "") ? d.sample : "";
    if (d.type === "linked") { const tgt = ALL.filter(x => x.table === d.target && x.type !== "system"); st[d.k] = tgt.some(x => st[x.k]) ? d.sample : ""; }
  }
}
function evalCond(c) {
  if (c.t === "filled") {
    const v = st[c.k]; if (v === "" || v == null) return c.msg || "Required.";
    const ranges = c.ranges || [];
    const r = ranges.find(x => x.when && x.when.vals.includes(st[x.when.k])) || ranges.find(x => !x.when);
    if (r) { const n = Number(v); if (!(n >= r.min && n <= r.max)) return r.msg; }
    return null;
  }
  if (c.t === "list") return (st[c.k] || []).length ? null : (c.msg || "Choose at least one.");
  if (c.t === "all") { const miss = c.keys.filter(k => !st[k]); return miss.length ? `${(c.msg || "Missing details").replace(/…/, miss.map(k => k.split(".")[1]).join(", "))}` : null; }
  if (c.t === "any") return c.keys.some(k => st[k]) ? null : (c.msg || "Not linked yet.");
  if (c.t === "eq") return st[c.k] === c.v ? null : (c.msg || "Wrong status.").replace(/…/, st[c.k]);
  return null;
}
function field(d) {
  const v = st[d.k] == null ? "" : st[d.k];
  const lab = `<label for="i_${norm(d.k)}">${esc(d.label)}${d.required ? ' <span class="req">*</span>' : ""}</label>`;
  if (d.type === "system" || d.type === "linked") return `<div class="field locked">${lab}<input id="i_${norm(d.k)}" value="${esc(d.type === "linked" && !v ? "Not linked yet" : v || "Set on save")}" readonly><div class="why">${esc(d.note || "")}</div></div>`;
  if (d.type === "computed") return `<div class="quotedbar"><div><div class="lab">${esc(d.label)}</div><div class="amt">R ${totalOf(d.from).toFixed(2)}</div></div></div>`;
  if (d.type === "select") return `<div class="field">${lab}<select id="i_${norm(d.k)}" data-k="${esc(d.k)}"><option value="">Select…</option>${d.options.map(o => `<option value="${esc(o.v || o)}" ${(o.v || o) === v ? "selected" : ""} ${o.off ? "disabled" : ""}>${esc(o.l || o)}${o.off ? " (inactive)" : ""}</option>`).join("")}</select></div>`;
  if (d.type === "toggle") return `<div class="field">${lab}<button class="tg" data-k="${esc(d.k)}" aria-pressed="${v === "yes"}"></button></div>`;
  return `<div class="field">${lab}<input id="i_${norm(d.k)}" data-k="${esc(d.k)}" type="${d.type === "number" ? "number" : d.type === "date" ? "date" : "text"}" value="${esc(v)}" placeholder="${esc(d.sample || "")}"></div>`;
}
function screen(step) {
  const sc = step.screen, i = STEPS.indexOf(step);
  let body = "";
  const nav = (next = "Next", disabled = false) => `<div class="nav"><button class="btn ghost" data-go="back" ${i === 0 ? "disabled" : ""}>Back</button><button class="btn go" data-go="next" ${disabled || i === STEPS.length - 1 ? "disabled" : ""}>${next}</button></div>`;
  if (sc.kind === "form") {
    const by = {}; (sc.fields || []).filter(d => d.type !== "computed").forEach(d => (by[d.table] ||= []).push(d));
    for (const [t, list] of Object.entries(by)) body += `<div class="card"><header>${esc(t.replace(/([a-z])([A-Z])/g, "$1 $2"))}</header><div class="body">${list.map(field).join("")}</div></div>`;
    if (sc.list) {
      const L = sc.list;
      body += `<div class="card"><header>${esc(L.label)}</header><div class="body">${L.options.map(o => `<button class="pick ${st[L.k].includes(o.v) ? "on" : ""}" data-pick="${esc(o.v)}" data-list="${esc(L.k)}" ${o.off ? "disabled" : ""}><span class="box">${st[L.k].includes(o.v) ? "✓" : ""}</span><b>${esc(o.code)}<small>${esc(o.l)}${o.off ? ", inactive" : ""}</small></b>${o.amt != null ? `<span>R ${Number(o.amt).toFixed(2)}</span>` : ""}</button>`).join("")}</div></div>`;
      body += (sc.fields || []).filter(d => d.type === "computed").map(field).join("");
    }
    body += `<p style="font-size:12.5px;color:#8A8A8A;margin:4px 2px 14px">Fill in with the sample values: <button class="btn ghost" style="width:auto;padding:4px 10px;font-size:12.5px" data-go="fill">Use sample data</button></p>`;
    body += nav();
  } else if (sc.kind === "validate") {
    const stale = validation && validation.version !== version;
    body += `<div class="card"><header>Validation</header><div class="body">${validation ? sc.checks.map(c => { const r = validation.results[c.code]; return `<div class="res ${r ? "bad" : "ok"}"><i>${r ? "!" : "✓"}</i><div>${esc(c.text)}<b>${esc(c.code)}</b>${r ? `<div class="m">${esc(r)}</div>` : ""}</div></div>`; }).join("") : `<p style="font-size:14px;color:#555;margin:0">Runs all ${sc.checks.length} business rules against the application captured so far.</p>`}
      ${stale ? `<p style="font-size:12.5px;color:#8A5A00;background:#FDF4E3;border:1px solid #EFD9AE;padding:8px;border-radius:3px">The application changed after this validation. Run it again.</p>` : ""}</div></div>
      <button class="btn" data-go="validate" style="margin-bottom:14px">${validation ? "Validate again" : "Validate"}</button>`;
    body += nav("Next", !validation || !validation.ok || stale);
  } else {
    const a = sc.action;
    const valOK = !a.needsValidation || (validation && validation.ok && validation.version === version);
    const rOK = roleOK(a.roles);
    const sOK = !a.statusKey || st[a.statusKey] === a.from;
    const done = a.statusKey && st[a.statusKey] === a.to;
    body += a.statusKey ? `<div class="status"><small>Status</small><b>${esc(st[a.statusKey])}</b></div>` : "";
    body += (sc.fields || []).map(field).join("");
    body += `<div class="card"><header>Before this can go through</header><div class="body">
      ${a.needsValidation ? `<div class="gate ${valOK ? "ok" : ""}"><i>${valOK ? "✓" : "!"}</i>${validation ? (validation.ok ? (validation.version === version ? "Validation passed" : "Validation is out of date: the application changed") : "Validation failed") : "Not validated yet"}</div>` : ""}
      ${a.roles.length ? `<div class="gate ${rOK ? "ok" : ""}"><i>${rOK ? "✓" : "!"}</i>Needs ${esc(a.roles.join(" or "))}; you are ${esc(roleSel || "unknown")}</div>` : ""}
      ${a.statusKey ? `<div class="gate ${sOK || done ? "ok" : ""}"><i>${sOK || done ? "✓" : "!"}</i>Status must be ${esc(a.from)}</div>` : ""}
    </div></div>
    <button class="btn go" data-go="act" ${(valOK && rOK && (sOK || done)) ? "" : "disabled"}>${esc(a.label)}</button>
    <div class="nav"><button class="btn ghost" data-go="back">Back</button><span></span></div>`;
  }
  return `<div class="statusbar"><span>12:14</span><span>●●● ■</span></div>
    <div class="appbar"><span class="burger"><i></i><i></i><i></i></span><span class="title">${esc(sc.title)}</span></div>
    <div class="viewport">${body}</div>`;
}
function toast(msg) { const ph = $("#phone"); const old = ph.querySelector(".toast"); if (old) old.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; ph.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }
function render() {
  const step = STEPS[cur]; visitSystem(step);
  $("#phone").innerHTML = screen(step);
  $("#railList").innerHTML = SPEC.phases.map((p, pi) => `<div class="railgroup">${esc(p)}</div>` + STEPS.map((s, i) => s.ph === pi ? `<button class="step ${i === cur ? "on" : i < cur ? "done" : ""}" data-i="${i}"><em>${s.n}</em><span>${esc(s.title)}${s.badge ? `<i class="badge">${esc(s.badge[0])}</i>` : ""}</span></button>` : "").join("")).join("");
  $("#noteStep").textContent = `Step ${step.n} · ${SPEC.phases[step.ph]}`;
  $("#noteTitle").textContent = step.title;
  $("#noteSpec").textContent = step.say;
  $("#noteRules").innerHTML = (step.badge ? `<li class="flagnote"><span class="tag gate">${esc(step.badge[0])}</span><span>${esc(step.badge[1])}</span></li>` : "") + step.rules.map(r => `<li><span class="tag ${r[0]}">${{ gate: "Gate", data: "Data", rule: "Rule", q: "Open" }[r[0]] || r[0]}</span><span>${esc(r[1])}</span></li>`).join("");
  const tr = step.trace;
  $("#trace").innerHTML = `<div><b>Requirement:</b> ${esc(tr.req ? `${tr.req} ${tr.reqTitle || ""}` : "none matched")}</div><div><b>Rules:</b> ${esc(tr.rules.join(", ") || "none")}</div><div><b>Tables:</b> ${esc(tr.tables.join(", ") || "none")}</div><div><b>Code:</b> ${tr.files.map(f => `<code>${esc(f.split("/").pop())}</code>`).join(", ") || "none matched"}</div><div><b>Tests:</b> ${tr.tests.map(f => `<code>${esc(f.split("/").pop())}</code>`).join(", ") || "none"}</div>`;
  const rows = Object.entries(st).map(([k, v]) => { const d = ALL.find(x => x.k === k); const shown = Array.isArray(v) ? v.join(", ") : d && d.options ? optL(d, v) : v; return `<div class="${fresh.has(k) ? "fresh" : ""}"><span class="k">${esc(k)}</span><span class="v ${shown ? "" : "empty"}">${esc(shown || "empty")}</span></div>`; });
  const tot = ALL.find(d => d.type === "computed"); if (tot && tot.from) rows.push(`<div><span class="k">${esc(tot.k)}</span><span class="v">R ${totalOf(tot.from).toFixed(2)}</span></div>`);
  if (validation) rows.push(`<div><span class="k">validation</span><span class="v">${validation.ok ? "passed" : "failed"}${validation.version !== version ? ", out of date" : ""}</span></div>`);
  $("#inspector").innerHTML = rows.join("");
  $("#hint").innerHTML = step.screen.kind === "form" ? "Capture is not blocked here. Rules are checked when the application is validated." : step.screen.kind === "validate" ? "Try leaving a required field empty, or pick values that break a rule, then validate." : "Switch the role in the top bar to see the role check.";
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.i) { cur = +b.dataset.i; return render(); }
  if (b.dataset.pick) { const k = b.dataset.list, arr = st[k].slice(); const i = arr.indexOf(b.dataset.pick); if (i >= 0) arr.splice(i, 1); else arr.push(b.dataset.pick); st[k] = arr; version++; fresh = new Set([k]); return render(); }
  if (b.classList.contains("tg")) { set(b.dataset.k, st[b.dataset.k] === "yes" ? "" : "yes"); return render(); }
  const go = b.dataset.go;
  if (go === "next" && cur < STEPS.length - 1) { cur++; render(); $(".viewport").scrollTop = 0; }
  else if (go === "back" && cur > 0) { cur--; render(); }
  else if (go === "fill") { const s = STEPS[cur]; (s.screen.fields || []).forEach(d => { if (!["system", "linked", "computed"].includes(d.type)) st[d.k] = SPEC.sample[d.k] || st[d.k]; }); if (s.screen.list) st[s.screen.list.k] = s.screen.list.sample.slice(); version++; fresh = new Set((s.screen.fields || []).map(d => d.k)); render(); }
  else if (go === "validate") { const sc = STEPS[cur].screen, results = {}; for (const c of sc.checks) { for (const cond of c.conds) { const m = evalCond(cond); if (m) { results[c.code] = m; break; } } } validation = { ok: !Object.keys(results).length, results, version }; render(); toast(validation.ok ? `All ${sc.checks.length} rules passed.` : `${Object.keys(results).length} rule${Object.keys(results).length > 1 ? "s" : ""} failed.`); }
  else if (go === "act") { const a = STEPS[cur].screen.action; if (a.statusKey && st[a.statusKey] === a.to) { toast(`Already ${a.to}. Nothing changed.`); return; } if (a.statusKey) st[a.statusKey] = a.to; (STEPS[cur].screen.fields || []).forEach(d => { if (d.type === "system" && !d.options) st[d.k] = new Date().toISOString().slice(0, 16).replace("T", " "); }); fresh = new Set([a.statusKey]); render(); toast(a.statusKey ? `Status is now ${a.to}.` : "Done."); }
});
document.addEventListener("input", e => { const k = e.target.dataset.k; if (!k) return; st[k] = e.target.value; version++; fresh = new Set([k]); const cursor = e.target.selectionStart; const id = e.target.id; renderNotesOnly(); });
document.addEventListener("change", e => { const k = e.target.dataset.k; if (!k || e.target.tagName !== "SELECT") return; set(k, e.target.value); render(); });
function renderNotesOnly() { const vp = $(".viewport"), sTop = vp ? vp.scrollTop : 0; const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart; render(); const v2 = $(".viewport"); if (v2) v2.scrollTop = sTop; if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } } }
$("#restart").onclick = () => { reset(); render(); };
reset(); render();
</script>

# Lens: web + worker + PostgreSQL. `docker compose up` starts everything; add `--profile demo` for sample data.
#   cp .env.example .env   (edit secrets)   then   docker compose up --build
# Demo data without GitLab:  docker compose --profile demo up --build   (sign in with the break-glass admin, see README)
name: lens

x-app-env: &app-env
  DATABASE_URL: postgresql://lens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lens?connection_limit=10
  LENS_ENCRYPTION_KEYS: ${LENS_ENCRYPTION_KEYS:?set LENS_ENCRYPTION_KEYS in .env}
  GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LENS_MODEL: ${LENS_MODEL:-}
  LENS_AI_PROVIDER: ${LENS_AI_PROVIDER:-anthropic}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lens
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: tools }
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  seed:
    profiles: [demo]
    build: { context: ., target: tools }
    command: ["npx", "vite-node", "scripts/seed.ts"]
    environment:
      <<: *app-env
      NODE_ENV: development
      LENS_FIXTURE_DIR: /app/test/fixtures
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      LENS_BOOTSTRAP_ADMINS: ${LENS_BOOTSTRAP_ADMINS:-}
      LENS_BREAK_GLASS_HASH: ${LENS_BREAK_GLASS_HASH:-}
      LENS_ALLOWED_ORIGINS: ${LENS_ALLOWED_ORIGINS:-}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment: *app-env
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:

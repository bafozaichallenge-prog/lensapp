# Fly.io: one app, two process groups (web, worker) from the same image. See docs/DEPLOY-FLY.md.
# Change `app` (must be globally unique) and `primary_region` (jnb = Johannesburg; `fly platform regions` lists others).
app = "lens-app-change-me"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile.render"

[deploy]
  # runs database migrations in a temporary machine before each release
  release_command = "npx prisma migrate deploy --schema packages/storage/prisma/schema.prisma"

[processes]
  web = "node apps/web/.next/standalone/apps/web/server.js"
  worker = "node dist/worker.mjs"

[env]
  PORT = "8080"
  HOSTNAME = "0.0.0.0"
  AUTH_TRUST_HOST = "true"
  # must be the public https URL of this app (turns on Secure cookies)
  AUTH_URL = "https://lens-app-change-me.fly.dev"
  GITLAB_BASE_URL = "https://gitlab.example.com"
  WORKER_HEALTH_PORT = "3001"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "1gb"
